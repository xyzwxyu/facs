name: Auto Bump Version

on:
  workflow_call:
    inputs:
      bump_type:
        description: Version increment to apply
        required: true
        type: string
    outputs:
      version:
        description: Version produced by the bump
        value: ${{ jobs.bump.outputs.version }}
      commit:
        description: Commit containing the version update
        value: ${{ jobs.bump.outputs.commit }}

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.push.outputs.commit }}

    steps:
      - name: Validate release request
        env:
          TARGET_REF: ${{ github.ref }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          if [ "$TARGET_REF" != "refs/heads/main" ]; then
            echo "Version bumps must be requested from main" >&2
            exit 1
          fi
          case "$BUMP_TYPE" in
            patch|minor|major) ;;
            *) echo "Unsupported bump type: $BUMP_TYPE" >&2; exit 1 ;;
          esac

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Install bump tool
        run: python -m pip install bump-my-version

      - name: Bump version
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: bump-my-version bump "$BUMP_TYPE"

      - name: Read bumped version
        id: version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        id: push
        run: |
          git push --follow-tags origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
