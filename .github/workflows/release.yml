name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    uses: ./.github/workflows/auto-bump.yml
    with:
      bump_type: ${{ inputs.bump_type }}
    permissions:
      contents: write

  release:
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.commit || github.ref }}
          fetch-depth: 0

      - name: Get version
        id: version
        env:
          BUMPED_VERSION: ${{ needs.bump.outputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${BUMPED_VERSION:-${TAG_NAME#v}}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: release_notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -f "docs/CHANGELOG.md" ]; then
            NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" docs/CHANGELOG.md | head -n -1)
          fi
          if [ -z "${NOTES:-}" ]; then
            NOTES="Release $VERSION"
          fi
          DELIMITER="END_NOTES_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "notes<<$DELIMITER"
            echo "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build -f docker/Dockerfile -t "facs:${VERSION}" .
          docker build -f docker/Dockerfile -t facs:latest .
